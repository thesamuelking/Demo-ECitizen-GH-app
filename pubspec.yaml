name: ghanaserve
description: E-citizen GH - Citizen Government Services App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Networking / Auth backend
  dio: ^5.4.3+1
  http: ^1.2.1

  # UI & Animations
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Storage & Security
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Form validation
  reactive_forms: ^17.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  url_launcher: ^6.2.6
  email_validator: ^2.1.17

  # Icons & fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
